# ─────────────────────────────────────────────────────────────────────────────
# Security Scans — Python deps + container images
# ─────────────────────────────────────────────────────────────────────────────
#
# Two complementary scans, both surfaced to GitHub Code Scanning when SARIF
# is produced so findings appear in the repo's Security tab:
#
#   1. pip-audit  ← scans the resolved uv.lock for known CVEs in Python deps
#                    (PyPI advisory DB + OSV). `--strict` exits non-zero on
#                    any finding, making this a hard merge gate.
#
#   2. Trivy      ← scans each built container image for OS package CVEs and
#                    Python package CVEs inside the image. We focus on
#                    HIGH/CRITICAL and ignore unfixed CVEs so the gate
#                    represents actionable findings only. Exit-code is `0`
#                    (informational) because base-image CVEs are often
#                    upstream-fixed but not yet rebuilt — findings are
#                    surfaced to GitHub code scanning rather than blocking.
#
# Triggers:
#   - PRs to main          → run scans on the proposed change
#   - Weekly cron (Mon 06Z) → catches newly-disclosed CVEs against unchanged
#                              code. Cron is intentionally early-week so the
#                              team sees results during business hours.
#   - workflow_dispatch    → manual on-demand scan
# ─────────────────────────────────────────────────────────────────────────────
name: Security Scans

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# `security-events: write` is required to upload SARIF to the GitHub
# code-scanning API. `contents: read` is the default-minimum for actions
# that read the repo.
permissions:
  contents: read
  security-events: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Python dependency audit
  # ───────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit (uv lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Export locked requirements
        # pip-audit operates on a flat requirements file. Production deps
        # only (--no-dev) — dev-only CVEs in pytest etc. should not fail CI
        # on a PR touching unrelated production code.
        run: uv export --frozen --no-hashes --no-dev -o requirements.txt

      - name: Run pip-audit
        # `--strict` flips warnings (e.g. yanked packages) into errors. This
        # is the hard gate referenced in CI_CD.md.
        run: uvx pip-audit --requirement requirements.txt --strict

  # ───────────────────────────────────────────────────────────────────────────
  # Container image scans — Trivy
  # ───────────────────────────────────────────────────────────────────────────
  # We build each image locally (no push) and feed it directly to Trivy. The
  # alternative — scanning images already published to GHCR — has worse cache
  # behavior on PRs (would scan the *previous* image) and a chicken-and-egg
  # problem on first PRs that introduce a new Dockerfile.
  # ───────────────────────────────────────────────────────────────────────────
  trivy:
    name: Trivy image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: churn-api
            dockerfile: project/Dockerfile.api
            context: .
          - image: churn-mlflow
            dockerfile: project/Dockerfile.mlflow
            context: .
          - image: churn-monitor
            dockerfile: project/monitoring/Dockerfile.monitor
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # `local/...` is an unprefixed tag — it lives only in the local
          # daemon and is unreachable to any registry. Trivy resolves it via
          # the Docker socket.
          tags: local/${{ matrix.image }}:scan
          # load: true imports the image into the local docker daemon so
          # the trivy-action can find it by ref. Without this, buildx would
          # produce only an OCI layout that Trivy can't read by name.
          load: true
          # Shared cache scope with docker.yml — a recent push-build warms
          # this PR's scan build.
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          # Focus on actionable findings. LOW/MEDIUM noise drowns out real
          # issues; teams that want them can rerun locally with -s ALL.
          severity: HIGH,CRITICAL
          # ignore-unfixed: drop CVEs with no upstream fix available. A
          # finding we can't act on is information, not a gate.
          ignore-unfixed: true
          # exit-code: "0" → do not fail the job on findings. Findings are
          # surfaced via SARIF instead — see Security tab and PR annotations.
          # Flip this to "1" if/when the team is ready to enforce a hard
          # gate on image CVEs.
          exit-code: "0"

      - name: Upload SARIF to GitHub code scanning
        # `if: always()` so SARIF still uploads when an earlier step
        # produces partial output.
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          # Distinct category per image — GitHub deduplicates findings within
          # a category, so without this the three image scans would clobber
          # each other in the Security tab.
          category: trivy-${{ matrix.image }}
