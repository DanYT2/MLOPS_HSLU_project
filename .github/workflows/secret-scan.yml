# ─────────────────────────────────────────────────────────────────────────────
# Secret scanning — Gitleaks
# ─────────────────────────────────────────────────────────────────────────────
#
# Detects committed secrets (AWS keys, GitHub tokens, generic high-entropy
# strings matching curated patterns) in the diff. Complements GitHub's own
# secret scanning by:
#
#   - running on every PR before merge (built-in secret scanning only
#     catches secrets matching partner providers, and only post-push)
#   - producing a SARIF report that lands in the Security → Code scanning UI
#   - failing the workflow when something matches, so PRs cannot land with
#     fresh secrets in them
#
# Triggers:
#   - PR to main → scan the diff
#   - Push to main → scan the merged state (defence in depth)
#   - Weekly cron → catches secrets whose patterns were added to gitleaks
#                    after they were originally committed
#
# Configuration: out-of-the-box rules. Custom rules / allowlists go in
# `.gitleaks.toml` at the repo root if needed.
# ─────────────────────────────────────────────────────────────────────────────
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

permissions:
  contents: read
  # Required to upload the SARIF report to the code-scanning API.
  security-events: write
  # Gitleaks-action reads PR comments to know whether to post a result
  # summary; pull-requests: read is enough for that.
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 → full history. Gitleaks scans every commit
          # touched by the event, not just the working tree. On a PR this
          # means every commit in the PR; on a push to main it means the
          # commits being pushed. Without full history, gitleaks would miss
          # secrets that were committed but later force-removed from HEAD.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_ENABLE_UPLOAD_ARTIFACT controls whether the gitleaks
          # SARIF report is uploaded as a workflow artifact in addition to
          # being attached to the run. Default is true; explicit for clarity.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          # GITLEAKS_ENABLE_SUMMARY: post a markdown summary on the workflow
          # run page so reviewers can see results without downloading SARIF.
          GITLEAKS_ENABLE_SUMMARY: "true"
