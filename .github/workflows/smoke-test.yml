# ─────────────────────────────────────────────────────────────────────────────
# Smoke test — boot a partial stack to prove the images interoperate
# ─────────────────────────────────────────────────────────────────────────────
#
# Unit tests prove individual modules work. Security scans prove no known
# CVEs. Neither catches "this image was built but immediately crashes on
# startup", or "the postgres init.sql doesn't create the schema the monitor
# expects", or "the API image is missing an OS package that one of the
# Python wheels dlopen's at import time."
#
# This workflow catches those by:
#
#   1. Building all three images via `docker compose build` so they share
#      the GHA layer cache produced by docker.yml — a hot run is fast.
#   2. Booting the *infrastructure* services (postgres + mlflow) using
#      `docker compose up -d` and waiting for their healthchecks.
#   3. Verifying postgres has the `monitoring_metrics` table that the
#      monitor service writes to. This proves init.sql ran.
#   4. Verifying mlflow's HTTP /health responds 200.
#   5. Running an import-only check inside the api and monitor images.
#      Importing the module exercises every transitive native dep (numpy,
#      lightgbm, xgboost, evidently, psycopg) — catching missing libgomp1
#      / libstdc++ / libpq.so etc. without needing a trained model.
#
# Why not boot the api itself? Because web_service.py's startup lifespan
# hard-fails if it cannot load the `CustomerChurnEnsemble@champion` model
# from the registry, and a CI smoke test should not depend on a trained
# model being available. The import-only check is the most useful signal
# we can produce without that.
#
# Triggers: PRs to main and pushes to main. Runs in parallel with ci.yml
# (no `needs:`), so a broken test suite doesn't prevent surfacing image
# breakage and vice versa.
# ─────────────────────────────────────────────────────────────────────────────
name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Compose stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Compose file lives in project/, so set every step's working
    # directory there. Avoids repeating `working-directory:` on each `run:`.
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Buildx is needed for `cache-from: type=gha` to work via Compose's
        # bake integration on newer Compose versions.
        uses: docker/setup-buildx-action@v3

      # ── Build all three images ─────────────────────────────────────────────
      # `docker compose build` reads docker-compose.yml and builds every
      # service that has a `build:` stanza. The runner has compose v2
      # pre-installed under `docker compose` (no hyphen).
      # ──────────────────────────────────────────────────────────────────────
      - name: Build images
        run: docker compose build api mlflow monitor

      # ── Start infrastructure-only services ─────────────────────────────────
      # We start only postgres and mlflow because:
      #   - they have well-defined readiness signals (healthchecks)
      #   - they do not depend on a trained model existing in the registry
      #   - they're the dependencies the monitor + api would otherwise need
      # The api and monitor are exercised via one-shot containers below.
      # ──────────────────────────────────────────────────────────────────────
      - name: Start infra services
        run: docker compose up -d postgres mlflow

      - name: Wait for postgres healthcheck
        # Loop polls `docker inspect` for the container's healthcheck status.
        # We give it 60s — postgres typically reports healthy within ~5s on
        # a warm cache. If we time out we dump logs and exit non-zero so the
        # failure annotation is helpful rather than mysterious.
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(docker compose ps --format json postgres | \
              python -c "import json,sys;d=json.loads(sys.stdin.read());print(d.get('Health',''))" || echo "")
            if [ "$status" = "healthy" ]; then
              echo "postgres healthy after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "::error::postgres did not become healthy"
          docker compose logs postgres
          exit 1

      - name: Verify init.sql created monitoring_metrics table
        # `docker compose exec -T` runs a one-shot psql inside the running
        # postgres container. The `-T` disables TTY allocation which is
        # required in non-interactive contexts like CI. We assert the table
        # exists via `\dt monitoring_metrics` and grep for the table name —
        # if init.sql failed to run, the table is missing and grep exits 1.
        run: |
          docker compose exec -T postgres \
            psql -U monitor -d monitoring -c '\dt monitoring_metrics' \
            | tee /tmp/dt.out
          grep -q monitoring_metrics /tmp/dt.out

      - name: Wait for MLflow /health
        # MLflow doesn't set a Compose healthcheck (would require adding
        # `curl` to the image), so we hit /health from the runner host via
        # the published port 5001.
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5001/health >/dev/null; then
              echo "mlflow up after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "::error::mlflow did not become ready"
          docker compose logs mlflow
          exit 1

      # ── Image import-only smoke (api) ──────────────────────────────────────
      # We can't run the api as a long-lived container without a trained
      # model in the registry (see header). Instead, we exec a Python import
      # inside a one-shot container — this loads every transitive native
      # extension (numpy / lightgbm / xgboost / mlflow / fastapi) and proves
      # the image's wheel set is internally consistent with the OS layer.
      # The `--entrypoint` override is necessary because the api image's
      # default CMD is `uv run fastapi run ...` which would try to start
      # the server.
      # ──────────────────────────────────────────────────────────────────────
      - name: API image — import smoke
        run: |
          docker compose run --rm --no-deps --entrypoint python api \
            -c "import web_service; print('api import OK')"

      # ── Image import-only smoke (monitor) ──────────────────────────────────
      # Same principle as the api smoke. The monitor image's CMD runs the
      # actual replay loop, which would block on the api being healthy.
      # Importing the module is sufficient to surface broken deps.
      # ──────────────────────────────────────────────────────────────────────
      - name: Monitor image — import smoke
        run: |
          docker compose run --rm --no-deps --entrypoint python monitor \
            -c "import monitor; print('monitor import OK')"

      # ── Diagnostic dump on failure ─────────────────────────────────────────
      # `if: failure()` runs only when an earlier step failed. Dumping logs
      # here means contributors don't have to re-run the workflow with extra
      # debug to figure out what broke.
      # ──────────────────────────────────────────────────────────────────────
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      # ── Always tear down ───────────────────────────────────────────────────
      # `if: always()` runs in both success and failure paths. Compose v2
      # cleanup is fast and prevents the runner from being charged for
      # lingering volumes if a future job is added that doesn't tear down.
      # ──────────────────────────────────────────────────────────────────────
      - name: Tear down
        if: always()
        run: docker compose down -v
