# ─────────────────────────────────────────────────────────────────────────────
# CodeQL — Python static analysis (SAST)
# ─────────────────────────────────────────────────────────────────────────────
#
# GitHub-native semantic code analysis. Catches a different class of issues
# than Ruff (which is style + AST patterns): CodeQL builds a database from
# the code, models data/control flow, and runs queries that look for things
# like SQL injection sinks reached from HTTP request sources, hard-coded
# credentials, or unsafe deserialization.
#
# Triggers:
#   - PR to main          → analyze the proposed change
#   - Push to main        → keep the main-branch baseline up to date so the
#                            PR diff is computed against a fresh baseline
#   - Weekly cron         → re-analyze with the latest query pack; new CodeQL
#                            queries find issues in unchanged code
#
# Findings appear in:
#   - the PR's Files Changed view as inline annotations
#   - repo Security → Code scanning alerts
#
# Cost: ~3–5 minutes per run on this codebase. Cheap enough to leave on PRs.
# ─────────────────────────────────────────────────────────────────────────────
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sundays 04:00 UTC — off-hours so we don't compete with developer
    # CI runs for shared Actions queue capacity.
    - cron: "0 4 * * 0"

# CodeQL writes findings to GitHub's code-scanning API and reads repo
# contents to build its database. No write access to source needed.
permissions:
  contents: read
  security-events: write
  # Required by github/codeql-action for newer toolchain initialization
  # paths that fetch language packs from the workflow's token.
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Structured as a matrix so adding JavaScript (e.g. for dashboard.html
      # if it grows beyond a static page) is a one-line addition.
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Initialize the CodeQL database ─────────────────────────────────────
      # `init` downloads the CodeQL CLI + the query pack for the chosen
      # language and prepares a scratch directory. `queries: security-extended`
      # selects a broader set than the default `security-and-quality`,
      # erring on the side of catching more potential issues (with a
      # corresponding higher false-positive rate — calibrate by triaging
      # findings in the Security tab).
      # ──────────────────────────────────────────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # For Python, CodeQL's autobuild is a no-op (Python is interpreted),
      # but we keep the step for symmetry with how the action is documented
      # — and so adding a compiled language to the matrix later doesn't
      # require restructuring this file.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # ── Run the queries and upload SARIF ───────────────────────────────────
      # `category` differentiates this analysis in the code-scanning UI from
      # Trivy findings (which use trivy-<image>). Without distinct categories,
      # findings would merge and individual scanner results would be hidden.
      # ──────────────────────────────────────────────────────────────────────
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
